  <rect x="30" y="28" width="30" height="12" rx="2" fill="#1a6fa0"/>
  <rect x="65" y="28" width="30" height="12" rx="2" fill="#1a6fa0"/>
  <rect x="100" y="28" width="30" height="12" rx="2" fill="#1a6fa0"/>

  <rect x="30" y="56" width="30" height="12" rx="2" fill="#1a6fa0"/>
  <rect x="65" y="56" width="30" height="12" rx="2" fill="#1a6fa0"/>
  <rect x="100" y="56" width="30" height="12" rx="2" fill="#1a6fa0"/>

